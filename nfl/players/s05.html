<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFL player stats</title>
<meta name="description" content="NFL game predictions, playoff odds, team and player history — an Elo model scored against the betting line.">
<style>
:root{
  --bg:#f6f7f9; --surface:#fff; --surface-2:#f1f3f6; --surface-3:#e4e8ee; --border:#dde2e8; --border-strong:#b9c1cc;
  --text:#14181f; --text-2:#3c4552; --muted:#677283; --accent:#1f6fd1;
  --series-1:#2a78d6; --series-2:#eb6834; --good:#006300; --bad:#c22c2c;
  --r-sm:5px; --r-md:8px; --r-lg:10px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1217; --surface:#161a21; --surface-2:#1c212a; --surface-3:#2a313c; --border:#2a313b; --border-strong:#46505e;
    --text:#e8ebf0; --text-2:#c2c8d2; --muted:#8c96a5; --accent:#5aa2f5;
    --series-1:#3987e5; --series-2:#d95926; --good:#3fbf3f; --bad:#e25a5a;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans)}
a{color:var(--accent)}
header.top{background:var(--surface);border-bottom:1px solid var(--border)}
header.top .in,main,footer .in{max-width:1180px;margin:0 auto;padding:0 16px}
header.top .in{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;min-height:52px}
header.top .brand{font-weight:700;font-size:16px;color:var(--text);text-decoration:none;letter-spacing:-.01em}
header.top nav{display:flex;gap:.2rem;flex-wrap:wrap}
header.top nav a{color:var(--text-2);text-decoration:none;padding:.35rem .6rem;border-radius:var(--r-sm);font-weight:500}
header.top nav a:hover,header.top nav a.cur{background:var(--surface-2);color:var(--text)}
main{padding-top:1.1rem;padding-bottom:1.5rem}
h1.page{font-size:22px;margin:0 0 .9rem;letter-spacing:-.02em}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.panel-head{display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap;padding:.7rem .95rem;border-bottom:1px solid var(--border)}
.panel-head h2{margin:0;font-size:15px}
table.dtable{width:100%;border-collapse:collapse}
.dtable th{font:600 10.5px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:.5rem .7rem;border-bottom:1px solid var(--border);white-space:nowrap}
.dtable td{padding:.45rem .7rem;border-bottom:1px solid var(--border);vertical-align:top}
.dtable tr:last-child td{border-bottom:0}
.btn{font:500 13px var(--sans);background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:var(--r-sm);padding:.35rem .6rem}
footer{border-top:1px solid var(--border);color:var(--muted);font-size:12px;padding:1rem 0 2rem}
footer a{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:1.1rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.9rem;margin-bottom:1.1rem}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:.85rem .95rem}
.kpi .lbl{font:600 10.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .val{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:.35rem;line-height:1.1}
.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:.25rem;line-height:1.4}
.section{margin-bottom:1.1rem}
.tm{display:inline-flex;align-items:center;gap:.4rem;text-decoration:none;color:var(--text);font-weight:600;white-space:nowrap}
.tm i{width:4px;height:16px;border-radius:2px;display:inline-block;flex:none}
.tm:hover{color:var(--accent)}
.t{font-size:11.5px;color:var(--muted)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.good{color:var(--good)} .bad{color:var(--bad)}
.pbar{display:inline-block;width:64px;height:7px;border-radius:4px;background:var(--surface-3);vertical-align:middle;margin-left:.4rem;overflow:hidden}
.pbar>b{display:block;height:100%;background:var(--series-1)}
.note{font-size:12px;color:var(--text-2);line-height:1.55;padding:.8rem .95rem;border:1px solid var(--border);background:var(--surface-2);border-radius:var(--r-md);margin-top:1rem}
.note b{color:var(--text)}
.weeks{display:flex;gap:.3rem;flex-wrap:wrap}
.weeks button{font:600 11px/1 var(--mono);padding:.3rem .45rem;border-radius:var(--r-sm);border:1px solid var(--border);background:transparent;color:var(--text-2);cursor:pointer}
.weeks button.cur{background:var(--accent);border-color:var(--accent);color:#fff}
.bracket{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:.6rem;padding:.9rem;overflow-x:auto}
.bracket .col h4{margin:0 0 .5rem;font:600 10.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.slot{border:1px solid var(--border);border-radius:var(--r-sm);padding:.4rem .5rem;margin-bottom:.4rem;background:var(--surface-2);font-size:12.5px}
.slot .seed{font:600 10.5px/1 var(--mono);color:var(--muted);margin-right:.35rem}
.slot .p{float:right;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chart svg{width:100%;height:auto;display:block}
.chart polyline{fill:none;stroke:var(--series-1);stroke-width:1.6}
.chart .axis{stroke:var(--border);stroke-width:1}
.chart text{fill:var(--muted);font:10px var(--mono)}
.overflow-x{overflow-x:auto}
.champ{font-weight:600;color:var(--good)}
.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.2rem 1.2rem;padding:.8rem .95rem}
.roster h4{margin:.6rem 0 .2rem;font:600 10.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.roster a{display:block;font-size:12.5px;padding:.1rem 0;text-decoration:none;color:var(--text)}
.roster a:hover{color:var(--accent)}
.search{display:flex;gap:.5rem;padding:.8rem .9rem}
.search input{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text);padding:.5rem .65rem;font:14px var(--sans)}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.3rem .8rem;padding:.8rem .95rem}
@media (max-width:640px){ .bracket{grid-template-columns:repeat(4,minmax(110px,1fr))} .kpi .val{font-size:20px} }
</style>
</head>

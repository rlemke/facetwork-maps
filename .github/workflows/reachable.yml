# Every map must be reachable from the front door.
#
# ⚠️ This exists because on 2026-09-01 a publish wrote a FRESH root index.html
# instead of adding to the existing one: 102 links removed, 4 added. All 220 map
# pages still existed — ten sections were simply orphaned in plain sight, and the
# publish reported success. It was found by a human noticing the site looked
# empty, three days later.
#
# It was also self-perpetuating: the publisher harvests the link list out of the
# EXISTING root index to merge into, so a truncated root stays truncated through
# every later regeneration.
name: Reachability

on: [push, pull_request]

jobs:
  reachable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every section with maps is linked from the root index
        run: |
          python - <<'PY'
          import pathlib, re, sys

          root = pathlib.Path("index.html")
          if not root.exists():
              sys.exit("no root index.html")
          links = re.findall(r'<li><a href=[\'"]([^\'"]+)[\'"]', root.read_text())
          linked_sections = {l.split("/")[0] for l in links if "/" in l}

          have = {p.parts[0] for p in pathlib.Path(".").glob("*/**/index.html")}
          have |= {p.parts[0] for p in pathlib.Path(".").glob("*/index.html")}
          have -= {".github"}

          orphaned = sorted(have - linked_sections)

          # ⚠️ Section reachability is NOT enough. Both road-safety maps were
          # linked only from us/index.html, so the section check passed while
          # neither map appeared on the front page — the user found them missing,
          # not the guard. Every map page must be reachable from the root either
          # DIRECTLY or via a section index that the root links.
          linked_pages = {l for l in links}
          for sec in sorted(linked_sections):
              sidx = pathlib.Path(sec, "index.html")
              if sidx.exists():
                  for m in re.findall(r'href=[\'"]([^\'"]+)[\'"]', sidx.read_text()):
                      if m.startswith(("http", "#", "mailto:")):
                          continue
                      m = m.split("#")[0].rstrip("/")
                      # A directory-style link ("giab/" or "giab") is the same
                      # page as "giab/index.html"; not normalising it reported
                      # four perfectly reachable studies as orphans.
                      cand = pathlib.Path(sec, m)
                      linked_pages.add(str(cand))
                      if not m.endswith(".html"):
                          linked_pages.add(str(cand / "index.html"))
          all_pages = {str(q) for q in pathlib.Path(".").glob("*/*/index.html")}
          unreachable = sorted(all_pages - linked_pages)
          print(f"map pages      : {len(all_pages)}")
          print(f"reachable      : {len(all_pages) - len(unreachable)}")
          if unreachable:
              print("\nUNREACHABLE map pages — nothing links to them, directly or via a section index:")
              for u in unreachable:
                  print(f"  {u}")
          print(f"root links      : {len(links)}")
          print(f"sections linked : {len(linked_sections)}")
          print(f"sections on disk: {len(have)}")

          broken = [l for l in links if not pathlib.Path(l).exists()]
          if broken:
              print("\nBROKEN links (target missing):")
              for b in broken:
                  print(f"  {b}")

          if orphaned:
              print("\nORPHANED sections — maps exist but nothing links to them:")
              for o in orphaned:
                  n = len(list(pathlib.Path(o).glob("**/index.html")))
                  print(f"  {o}  ({n} page(s))")

          if orphaned or broken or unreachable:
              sys.exit("the front door does not reach every map")
          print("\nOK — every section is reachable and every link resolves")
          PY

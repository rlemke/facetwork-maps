name: Deploy static site to Pages

# Publishes the whole repo (pre-built self-contained HTML maps) to GitHub Pages
# via the Actions static-deploy path — replaces the legacy Jekyll builder, which
# timed out as the site grew past ~500 MB. The map bundles are pushed to `main`
# by the Facetwork PublishWebBundle workflow; this deploys them on every push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

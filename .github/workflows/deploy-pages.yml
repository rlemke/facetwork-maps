name: Deploy static site to Pages

# Publishes the whole repo (pre-built self-contained HTML maps) to GitHub Pages
# via the Actions static-deploy path — replaces the legacy Jekyll builder, which
# timed out as the site grew past ~500 MB. The map bundles are pushed to `main`
# by the Facetwork PublishWebBundle workflow; this deploys them on every push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Two jobs, as in GitHub's starter workflow: with upload and deploy in one
  # job, deploy-pages looked the ~500 MB artifact up 0.2 s after the upload
  # finalised and from 2026-11-23 often found none ("No artifacts named
  # github-pages"), on v3/v4 and v5 alike. The job boundary gives it time.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
